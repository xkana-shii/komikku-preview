name: Remote Dispatch Build Preview App

on:
  # Dispatch or Manual triggers
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref to build (branch, tag...)
        required: false
      dry-run:
        description: Creates a draft release (any value would create a draft)
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.git-ref }}
  cancel-in-progress: true

jobs:
  prepare-build:
    if: github.event.inputs.git-ref != ''
    runs-on: 'ubuntu-24.04'
    outputs:
      CURRENT_SHA: ${{ steps.current_commit.outputs.CURRENT_SHA }}
      PREV_RELEASE_SHA: ${{ steps.previous_commit.outputs.PREV_RELEASE_SHA }}
      COMMIT_LOGS: ${{ steps.commit_logs.outputs.COMMIT_LOGS }}
      ARTIFACTS_PREFIX: ${{ steps.prepare_env.outputs.ARTIFACTS_PREFIX }}
      BUILD_TYPE_NAME: ${{ steps.prepare_env.outputs.BUILD_TYPE_NAME }}
      TAG_NAME: ${{ steps.prepare_env.outputs.TAG_NAME }}
      PREV_TAG_NAME: ${{ steps.previous_commit.outputs.PREV_TAG_NAME }}
    steps:
      - name: Clone Repository (${{ github.event.inputs.git-ref }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'xkana-shii/komikku'
          fetch-depth: 0
          ref: ${{ github.event.inputs.git-ref }}

      - name: Get previous release
        id: last_release
        uses: InsonusK/get-latest-release@7a9ff16c8c6b7ead5d71c0f1cc61f2703170eade # v1.1.0
        with:
          myToken: ${{ github.token }}
          exclude_types: "draft"
          view_top: 1

      - name: Current commit
        id: current_commit
        run: |
          commit_count=$(git rev-list --count HEAD)
          current_sha=$(git rev-parse --short HEAD)

          echo "COMMIT_COUNT=$commit_count" >> "$GITHUB_OUTPUT"
          echo "CURRENT_SHA=$current_sha" >> "$GITHUB_OUTPUT"

      - name: Previous commit
        id: previous_commit
        run: |
          previous_tag="${{ steps.last_release.outputs.tag_name }}"

          if [ -n "$previous_tag" ] && git rev-parse "$previous_tag^{commit}" >/dev/null 2>&1; then
            prev_release_sha=$(git rev-parse --short "$previous_tag")
          else
            prev_release_sha=$(git rev-parse --short HEAD~1)
          fi

          echo "PREV_RELEASE_SHA=$prev_release_sha" >> "$GITHUB_OUTPUT"
          echo "PREV_TAG_NAME=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare env
        id: prepare_env
        run: |
          tag_prefix=r
          artifacts_prefix=nightly/app
          build_type_name=Preview

          echo "TAG_NAME=${tag_prefix}${{ steps.current_commit.outputs.COMMIT_COUNT }}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACTS_PREFIX=$artifacts_prefix" >> "$GITHUB_OUTPUT"
          echo "BUILD_TYPE_NAME=$build_type_name" >> "$GITHUB_OUTPUT"

  build-app:
    runs-on: 'ubuntu-24.04'
    needs: prepare-build

    steps:
      - name: Clone Repository (${{ github.event.inputs.git-ref }} - ${{ needs.prepare-build.outputs.TAG_NAME }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'xkana-shii/komikku'
          fetch-depth: 0
          ref: ${{ github.event.inputs.git-ref }}

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Check optional secrets
        id: opt_secrets
        run: |
          echo "client_secrets=${{ secrets.GOOGLE_CLIENT_SECRETS_JSON != '' }}" >> "$GITHUB_OUTPUT"

      - name: Write client_secrets.json
        if: steps.opt_secrets.outputs.client_secrets == 'true'
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          write-mode: overwrite

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        run: |
          ./gradlew assembleNightly \
            -Pdist=ci \
            -Pinclude-telemetry=false \
            -Penable-updater \
            -PdevSecret="${{ secrets.DEV_SECRETS }}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: "**/*.apk"
          retention-days: 1

  release-app:
    runs-on: 'ubuntu-24.04'
    needs:
      - prepare-build
      - build-app

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Sign APK
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: app/build/outputs/apk/nightly
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Get SHA & clean up build artifacts
        id: get_sha
        run: |
          set -e

          prefix="app/build/outputs/apk/${{ needs.prepare-build.outputs.ARTIFACTS_PREFIX }}"
          tag="${{ needs.prepare-build.outputs.TAG_NAME }}"

          mv "${prefix}-universal-nightly-signed.apk" \
            "Komikku-${tag}.apk"

          mv "${prefix}-arm64-v8a-nightly-signed.apk" \
            "Komikku-arm64-v8a-${tag}.apk"

          mv "${prefix}-armeabi-v7a-nightly-signed.apk" \
            "Komikku-armeabi-v7a-${tag}.apk"

          mv "${prefix}-x86-nightly-signed.apk" \
            "Komikku-x86-${tag}.apk"

          mv "${prefix}-x86_64-nightly-signed.apk" \
            "Komikku-x86_64-${tag}.apk"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-build.outputs.TAG_NAME }}
          name: Komikku ${{ needs.prepare-build.outputs.BUILD_TYPE_NAME }} ${{ needs.prepare-build.outputs.TAG_NAME }}
          body: |
            [![GitHub downloads](https://img.shields.io/github/downloads/xkana-shii/komikku-preview/${{ needs.prepare-build.outputs.TAG_NAME }}/total?label=Downloaded&labelColor=27303D&color=0D1117&logo=github&logoColor=FFFFFF&style=flat)](https://github.com/xkana-shii/komikku-preview/releases/${{ needs.prepare-build.outputs.TAG_NAME }})

            #### What's Changed
            ##### New

            ##### Improve

            ##### Fix

            ${{ needs.prepare-build.outputs.COMMIT_LOGS }}

            **Full Changelog**: [xkana-shii/komikku@${{ needs.prepare-build.outputs.PREV_TAG_NAME }}...${{ needs.prepare-build.outputs.CURRENT_SHA }}](https://github.com/xkana-shii/komikku/compare/${{ needs.prepare-build.outputs.PREV_RELEASE_SHA }}...${{ needs.prepare-build.outputs.CURRENT_SHA }})

            > [!TIP]
            > If you are unsure which version to download, use `Komikku-${{ needs.prepare-build.outputs.TAG_NAME }}.apk`.

          files: |
            Komikku-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
            Komikku-arm64-v8a-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
            Komikku-armeabi-v7a-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
            Komikku-x86-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
            Komikku-x86_64-${{ needs.prepare-build.outputs.TAG_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
